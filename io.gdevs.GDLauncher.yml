app-id: io.gdevs.GDLauncher

base: org.electronjs.Electron2.BaseApp
base-version: '25.08'

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

command: gd.sh

build-options:
  env:
    PATH: /app/jre/bin:/usr/bin

finish-args:
  - --socket=x11
  - --share=ipc
  - --device=all
  - --socket=pulseaudio
  - --share=network
  - --env=CHROME_WRAPPER=zypak-wrapper
  - --filesystem=xdg-download

modules:
  - name: gdlauncher
    buildsystem: simple

    build-commands:
      - npm ci --offline --ignore-scripts
      - npm run napi-build
      - npm run nsfw-move
      - NODE_OPTIONS=--openssl-legacy-provider npm run build
      - NODE_OPTIONS=--openssl-legacy-provider npm run build-electron:setup

      - install -d /app/main
      - cp -a build /app/main/
      - cp -a public /app/main/
      - cp package.json /app/main/

      - install -Dm755 gd.sh /app/bin/gd.sh

      - install -Dm644 gdlauncherscaled.png /app/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - install -Dm644 ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml

    sources:
      - type: git
        url: https://github.com/TangoMango614/GDLauncher.git
        commit: 3c4dc7f049500308fce1e353506bbdec64b2693

      - generated-sources.yml

      - type: file
        path: io.gdevs.GDLauncher.desktop

      - type: file
        path: gdlauncherscaled.png

      - type: file
        path: io.gdevs.GDLauncher.metainfo.xml

      - type: script
        dest-filename: gd.sh
        commands:
          - zypak-wrapper /app/bin/electron /app/main/build/electron.js

  - name: xrandr
    sources:
      - type: archive
        url: https://www.x.org/archive/individual/app/xrandr-1.5.1.tar.gz
        sha256: 7b99edb7970a136e5af5bcaf552144e4dfc3ccf510c4abc08569849929fb366e